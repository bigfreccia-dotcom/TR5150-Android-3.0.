name: Build TR5150 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TR5150_Android_3_0_GITHUB_BUILD.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q TR5150_Android_3_0_GITHUB_BUILD.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk TR5150_3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TR5150-3.0-APK
          path: TR5150_3.0.apk
          if-no-files-found: error
